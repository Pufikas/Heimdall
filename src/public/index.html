<!DOCTYPE html>
<html>
<head>
    <title>Heimdall Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1 id="hostname">HOST</h1>

        <div class="panels-row">
            <pre id="cpu" class="box">CPU</pre>
            <pre id="ram" class="box">RAM</pre>
            <pre id="disk" class="box">DISK</pre>
        </div>

        <div id="docker" class="docker-containers">
            <table class="dockerTable">
                <thead>
                    <tr>
                        <th>CONTAINER ID</th>
                        <th>NAMES</th>
                        <th>STATUS</th>
                    </tr>
                </thead>

                <tbody id="dockerBody">
                    
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
</body>
</html>
